<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CLEAR Motion · SpringAnimator</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #f5f6f8; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  .track { width: 320px; height: 96px; display: flex; align-items: center;
           padding: 0 16px; border-radius: 24px; background: #e1e5eb; }
  .ball { width: 64px; height: 64px; border-radius: 20px; background: #3f78d1;
          box-shadow: 0 12px 28px rgba(63, 120, 209, .32); will-change: transform; }
  .hint { position: fixed; bottom: 28px; color: #737b89; font-size: 13px; }
</style>
</head>
<body>
  <div class="track"><div class="ball" id="ball"></div></div>
  <div class="hint">点击任意位置，方块会沿弹簧曲线弹到另一侧</div>

  <script src="../src/PhysicsEngine.js"></script>
  <script>
    const ball = document.getElementById('ball');
    const distance = 224; // 320 - 16*2 - 64

    const anim = new SpringAnimator(0, {
      stiffness: 320,
      damping: 22,
      mass: 1,
      roughness: 0.02,
      airResistance: 0.01,
      onUpdate: value => {
        ball.style.transform = `translateX(${value}px)`;
      }
    });

    let atEnd = false;
    document.addEventListener('click', () => {
      atEnd = !atEnd;
      anim.setTarget(atEnd ? distance : 0);
    });
  </script>
</body>
</html>
